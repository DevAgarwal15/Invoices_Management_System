<div class="animate-on-load animate-fade-in-up mb-8 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
  <div>
    {% if eyebrow %}
    <p class="text-xs font-semibold uppercase tracking-widest text-brand-600">{{ eyebrow }}</p>
    {% endif %}
    <h1 class="{% if eyebrow %}mt-2{% endif %} text-2xl font-semibold tracking-tight text-zinc-900 sm:text-3xl">{{ title }}</h1>
    {% if subtitle %}
    <p class="mt-2 max-w-2xl text-sm leading-6 text-zinc-500">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% if actions %}
  <div class="flex shrink-0 flex-wrap items-center gap-3">
    {{ actions }}
  </div>
  {% endif %}
</div>
