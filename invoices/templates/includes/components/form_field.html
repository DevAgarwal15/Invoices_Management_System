<div class="space-y-2">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-zinc-700">
    {{ field.label }}
    {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
  <p class="text-xs text-zinc-500">{{ field.help_text|safe }}</p>
  {% endif %}
  {% if field.errors %}
  <p class="text-sm text-red-600">{{ field.errors.0 }}</p>
  {% endif %}
</div>
