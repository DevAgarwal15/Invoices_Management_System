{% if messages %}
<div class="fixed right-4 top-20 z-[60] flex max-w-sm flex-col gap-2">
  {% for message in messages %}
  <div class="animate-on-load animate-fade-in-up flex items-start gap-3 rounded-xl border border-zinc-200 bg-white px-4 py-3 text-sm text-zinc-700 shadow-lg shadow-zinc-200/50"
       role="alert">
    <i data-lucide="info" class="mt-0.5 h-4 w-4 shrink-0 text-brand-600"></i>
    <span>{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
