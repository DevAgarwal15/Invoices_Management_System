<div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-[0_20px_45px_-24px_rgba(15,23,42,0.35)] transition duration-200 hover:-translate-y-1 hover:shadow-[0_25px_60px_-20px_rgba(79,70,229,0.35)]">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-sm font-medium text-slate-500">{{ title }}</p>
      <h3 class="mt-3 text-3xl font-semibold text-slate-900">{% if prefix %}{{ prefix }}{% endif %}{{ value }}</h3>
    </div>
    <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-50 text-indigo-600">
      <i data-lucide="{{ icon }}" class="h-5 w-5"></i>
    </div>
  </div>
</div>
