<div class="animate-on-load animate-fade-in-up glass-card p-5 transition duration-300 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-zinc-200/50 sm:p-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <p class="text-xs font-medium uppercase tracking-wider text-zinc-500">{{ title }}</p>
      <p class="mt-2 text-2xl font-semibold tracking-tight text-zinc-900 sm:text-3xl">
        {% if prefix %}{{ prefix }}{{ value|floatformat:2 }}{% else %}{{ value }}{% endif %}
      </p>
      {% if change %}
      <p class="mt-1.5 flex items-center gap-1 text-xs font-medium {% if change_positive %}text-emerald-600{% else %}text-zinc-400{% endif %}">
        {% if change_icon %}<i data-lucide="{{ change_icon }}" class="h-3 w-3"></i>{% endif %}
        {{ change }}
      </p>
      {% endif %}
    </div>
    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-brand-50 text-brand-600 ring-1 ring-brand-100">
      <i data-lucide="{{ icon }}" class="h-5 w-5"></i>
    </div>
  </div>
</div>
