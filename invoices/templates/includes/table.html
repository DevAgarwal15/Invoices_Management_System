<div class="animate-on-load animate-fade-in-up glass-card overflow-hidden">
  <div class="flex flex-col gap-4 border-b border-zinc-100 px-6 py-5 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="text-base font-semibold text-zinc-900">{{ title }}</h3>
      {% if subtitle %}<p class="mt-1 text-sm text-zinc-500">{{ subtitle }}</p>{% endif %}
    </div>
    {% if show_search %}
    <div class="flex items-center gap-2">
      <div class="relative">
        <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400"></i>
        <input type="search" placeholder="Search..."
               class="rounded-xl border border-zinc-200 bg-zinc-50 py-2 pl-9 pr-4 text-sm focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20">
      </div>
    </div>
    {% endif %}
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full">
      <thead>
        <tr class="border-b border-zinc-100 bg-zinc-50/50">
          <th class="table-header">Invoice</th>
          <th class="table-header">Customer</th>
          <th class="table-header">Amount</th>
          <th class="table-header">Status</th>
          {% if show_actions %}<th class="table-header text-right">Action</th>{% endif %}
        </tr>
      </thead>
      <tbody class="divide-y divide-zinc-100">
        {{ rows }}
      </tbody>
    </table>
  </div>
</div>
