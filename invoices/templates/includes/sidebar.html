<aside class="w-64 min-h-screen bg-slate-900 text-white fixed">

    <div class="p-6 border-b border-slate-700">
        <h1 class="text-2xl font-bold text-indigo-400">
            InvoiceMS
        </h1>
    </div>

    <nav class="mt-6">

        <a href="{% url 'dashboard' %}"
        class="flex items-center gap-3 px-6 py-3 rounded-lg mx-3 bg-indigo-600 text-white">

            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span>Dashboard</span>

        </a>

        <a href="{% url 'show_invoices' %}"
        class="flex items-center gap-3 px-6 py-3 rounded-lg mx-3 hover:bg-slate-800 transition">

            <i data-lucide="receipt" class="w-5 h-5"></i>
            <span>Invoices</span>

        </a>

        <a href="#"
        class="flex items-center gap-3 px-6 py-3 rounded-lg mx-3 hover:bg-slate-800 transition">

            <i data-lucide="user" class="w-5 h-5"></i>
            <span>Profile</span>

        </a>

        <form action="{% url 'logout' %}" method="post" class="mx-3 mt-6">
            {% csrf_token %}

            <button type="submit"
                    class="w-full flex items-center gap-3 px-6 py-3 rounded-lg hover:bg-red-600 transition">

                <i data-lucide="log-out" class="w-5 h-5"></i>
                <span>Logout</span>

            </button>
        </form>

    </nav>

</aside>
