<header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-zinc-200/80 bg-white/80 px-4 backdrop-blur-xl sm:px-6 lg:px-8">
  <div class="flex items-center gap-3">
    <button id="sidebar-toggle" type="button"
            class="rounded-xl border border-zinc-200 p-2 text-zinc-600 transition hover:bg-zinc-50 lg:hidden"
            aria-label="Open sidebar">
      <i data-lucide="menu" class="h-5 w-5"></i>
    </button>
    <div>
      <h1 class="text-base font-semibold tracking-tight text-zinc-900 sm:text-lg">
        {{ page_title|default:"Dashboard" }}
      </h1>
      <p class="hidden text-xs text-zinc-500 sm:block">
        Welcome back, {{ request.user.username }}
      </p>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-3">
    <div class="relative hidden md:block">
      <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-400"></i>
      <input type="search" placeholder="Search invoices..."
             class="w-56 rounded-xl border border-zinc-200 bg-zinc-50 py-2 pl-9 pr-4 text-sm text-zinc-900 transition placeholder:text-zinc-400 focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 lg:w-64">
    </div>

    <button type="button"
            class="relative flex h-9 w-9 items-center justify-center rounded-xl border border-zinc-200 text-zinc-500 transition duration-200 hover:border-zinc-300 hover:bg-zinc-50 hover:text-zinc-900"
            aria-label="Notifications">
      <i data-lucide="bell" class="h-4 w-4"></i>
      <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-brand-500"></span>
    </button>

    <a href="{% url 'add_invoice' %}" class="btn-primary hidden !py-2 !px-3.5 text-xs sm:inline-flex">
      <i data-lucide="plus" class="h-3.5 w-3.5"></i>
      New invoice
    </a>
  </div>
</header>
